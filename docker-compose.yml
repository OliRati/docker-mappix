name: symfony-dev

services:

  certgen:
    image: alpine:3.20
    volumes:
      - ./cert:/cert
    command: >
      sh -c "
      apk add --no-cache openssl &&
      mkdir -p /cert &&
      if [ ! -f /cert/localhost.crt ] || [ ! -f /cert/localhost.key ]; then
        echo 'Generating self-signed certificate';
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /cert/localhost.key -out /cert/localhost.crt -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1';
      else
        echo 'Certificate already exists';
      fi
      "
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ./mappix:/var/www
      - ./cert:/var/www/cert
      - ./.env.local:/var/www/.env.local
    depends_on:
      certgen:
        condition: service_completed_successfully
      database:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./mappix:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./cert:/etc/nginx/certs
    depends_on:
      certgen:
        condition: service_completed_successfully
      php:
        condition: service_started

  node:
    image: node:22
    working_dir: /var/www
    volumes:
      - ./mappix:/var/www
      - ./cert:/var/www/cert
      - ./.env.local:/var/www/.env.local
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      certgen:
        condition: service_completed_successfully

  database:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: database
    ports:
      - "8081:80"
    depends_on:
      - database

volumes:
  db_data:
